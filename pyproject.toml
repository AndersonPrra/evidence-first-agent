[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-first-agent"
version = "0.1.0"
description = "Evidence-first analytical system for biodiversity monitoring data"
requires-python = ">=3.10,<=3.14.7"

dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0"
]

[project.optional-dependencies]
llm = [
    "ollama>=0.4"
]

dev = [
    "pytest>=8.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]